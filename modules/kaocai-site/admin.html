<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>考猜後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F6EEDC; --card:#FFFFFF; --navy:#1F2D4A; --gold:#C9A24B; --ink:#3A3F4B; --muted:#8A909B; --line:#ECE4D2;
    --rose:#F7D6D9; --rose-ink:#B4505D; --mint:#D3EEDF; --mint-ink:#2F7A56; --lilac:#E4DCF5; --lilac-ink:#6B54A8;
    --lemon:#FBF0C9; --lemon-ink:#8A6A12; --sky:#D6E8F7; --sky-ink:#3D6E9E; --grey:#F1EFE8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
  button{font:inherit;cursor:pointer}
  input,select{font:inherit}
  [hidden]{display:none!important}
  .card{background:var(--card);border-radius:16px;padding:18px}
  .center{max-width:420px;margin:12vh auto;padding:0 16px}
  h1{font-size:22px;color:var(--navy);margin:0 0 6px}
  h2{font-size:17px;color:var(--navy);margin:0 0 10px}
  .muted{color:var(--muted);font-size:13px}
  .in{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
  .in:focus{outline:none;border-color:var(--gold)}
  .btn{border:0;border-radius:12px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:700}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line);font-weight:500}
  .btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
  .btn.danger{background:var(--rose);color:var(--rose-ink)}
  .btn:disabled{opacity:.5;cursor:wait}
  .msg{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:14px}
  .msg.err{background:var(--rose);color:var(--rose-ink)} .msg.ok{background:var(--mint);color:var(--mint-ink)} .msg.info{background:var(--lemon);color:var(--lemon-ink)}

  /* shell */
  .shell{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:100vh}
  nav{background:#fff;border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
  nav .brand{font-weight:700;color:var(--navy);padding:4px 8px 12px}
  nav .sec{font-size:12px;color:var(--muted);padding:10px 8px 4px}
  nav a{display:block;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px}
  nav a.on{background:var(--sky);color:var(--sky-ink);font-weight:700}
  nav a.soon{color:#B9B6AE;pointer-events:none}
  main{padding:14px 18px 40px;min-width:0}
  .topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .topbar select{padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
  .spacer{flex:1}
  .switch{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer}
  .dot{width:9px;height:9px;border-radius:50%;background:#C9C4B8}
  .switch.on .dot{background:#3BA272}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .pill{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px}
  .pill.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:10px 0 14px}
  .stat{background:#fff;border-radius:12px;padding:8px 10px}
  .stat b{display:block;font-size:22px;color:var(--navy)}
  .stat span{font-size:12px;color:var(--muted)}
  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  .tools .in{width:200px;padding:7px 10px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:14px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{background:#FBF8F1;color:var(--muted);font-weight:500;font-size:13px;position:sticky;top:0}
  tr.cx td{color:#B3AFA5}
  tr.cx td.nm{text-decoration:line-through}
  .tbl{overflow:auto;border-radius:12px;max-height:70vh}
  .chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px}
  .c-in{background:var(--sky);color:var(--sky-ink)} .c-out{background:var(--lemon);color:var(--lemon-ink)}
  .c-cx{background:var(--rose);color:var(--rose-ink)}
  .att{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
  .att button{border:0;background:#fff;padding:6px 12px;font-size:14px;min-width:52px}
  .att button+button{border-left:1.5px solid var(--line)}
  .att .y.on{background:var(--mint);color:var(--mint-ink);font-weight:700}
  .att .n.on{background:var(--rose);color:var(--rose-ink);font-weight:700}
  .att .u.on{background:var(--grey);color:var(--ink);font-weight:700}
  .meal{border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff}
  .toast{position:fixed;right:16px;bottom:16px;padding:10px 14px;border-radius:12px;background:var(--navy);color:#fff;font-size:14px;z-index:50;max-width:360px}
  .toast.err{background:var(--rose-ink)}
  /* meals */
  .mealgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .mealday h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
  .mealday ul{margin:0;padding-left:18px;font-size:14px;columns:2}
  /* seats */
  .seatwrap{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:14px;user-select:none;-webkit-user-select:none}
  .seatgrid{display:grid;gap:5px;background:#fff;border-radius:16px;padding:14px;align-content:start;touch-action:none}
  .seat{min-height:44px;border:1.5px dashed #E2DCCD;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:2px}
  .seat.aisle{border:0}
  .seat.door{border:0;color:var(--muted);font-size:12px}
  .seat.hover,.unlist.hover{background:var(--sky);border-style:solid;border-color:var(--sky-ink)}
  .sc{cursor:grab;width:100%;text-align:center;font-size:13px;padding:6px 4px;border-radius:8px;background:var(--mint);color:var(--mint-ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;touch-action:none}
  .sc.out{background:var(--lemon);color:var(--lemon-ink)}
  .sc.cx{background:var(--grey);color:#A9A59B;text-decoration:line-through}
  .unlist{background:#fff;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:5px;min-height:300px;border:1.5px solid transparent}
  .unlist .sc{background:var(--lilac);color:var(--lilac-ink)}
  .dragghost{position:fixed;pointer-events:none;z-index:60;width:84px;opacity:.92;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .panel{background:#fff;border-radius:16px;padding:14px;margin-top:12px;border:1.5px solid var(--line)}
  .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px 10px;margin:10px 0;font-size:14px}
  /* 通用表格 */
  .dt-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  .dt-tools .in{width:220px;padding:7px 10px}
  .dt th{cursor:pointer;user-select:none}
  .dt th.nosort{cursor:default}
  .dt th[draggable="true"]{cursor:grab}
  .dt th.dragging{opacity:.4}
  .dt th.drop-before{box-shadow:inset 3px 0 0 var(--gold)}
  .dt th.drop-after{box-shadow:inset -3px 0 0 var(--gold)}
  .dt th .ar{color:var(--gold);font-size:11px;margin-left:3px}
  .dt tr.filters th{background:#fff;padding:4px 6px;cursor:default;position:static}
  .dt tr.filters input,.dt tr.filters select{width:100%;min-width:60px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:#fff}
  .dt tbody tr{cursor:pointer}
  .dt tbody tr:hover td{background:#FDFBF6}
  .dt tbody tr.sel td{background:#F3F7FC}
  .dt td.wrap{white-space:pre-line;min-width:180px;max-width:360px}
  .dt td.num,.dt th.num{text-align:right;font-variant-numeric:tabular-nums}
  .dt tfoot td{background:#FBF8F1;font-weight:700;color:var(--navy)}
  .sumline{margin-right:auto;color:var(--navy);font-weight:700;font-variant-numeric:tabular-nums}
  .dt td.ck,.dt th.ck{width:34px;cursor:default}
  .pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:13px;color:var(--muted)}
  .pager select{border:1px solid var(--line);border-radius:8px;padding:3px 6px;background:#fff}
  .pop{position:absolute;z-index:40;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 8px 24px rgba(31,45,74,.12);max-height:60vh;overflow:auto;min-width:220px}
  .pop .row{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:14px}
  .pop .row label{flex:1}
  .pop .mv{border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 6px;font-size:12px}
  .subtabs{display:flex;gap:6px;margin-bottom:12px}
  .drawer-bg{position:fixed;inset:0;background:rgba(31,45,74,.25);z-index:70}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;z-index:71;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(31,45,74,.15)}
  .drawer header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .drawer header h2{margin:0;flex:1}
  .drawer .body{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
  .drawer footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .fld label.l{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .fld .in{padding:8px 10px}
  .fld textarea.in{min-height:70px;resize:vertical}
  .fld .hint{font-size:12px;color:var(--muted);margin-top:3px}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .opts label{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;cursor:pointer}
  .opts label:has(input:checked){border-color:var(--navy);background:#F3F5F9}
  .clist{display:flex;flex-direction:column;gap:6px}
  .clist label{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px;cursor:pointer}
  .clist label:has(input:checked){border-color:var(--navy);background:#F3F5F9}
  .confirmbar{background:var(--rose);color:var(--rose-ink);border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
  .c-ok{background:var(--mint);color:var(--mint-ink)} .c-grey{background:var(--grey);color:var(--muted)} .c-lilac{background:var(--lilac);color:var(--lilac-ink)}
  @media print{
    nav,.topbar,.tools,.unlist,.noprint,.panel{display:none!important}
    .shell{display:block} main{padding:0} body{background:#fff}
    .seatwrap{display:block} .seat{border-color:#999}
    @page{size:landscape;margin:10mm}
  }
  @media (max-width:820px){ .shell{grid-template-columns:1fr} nav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px} nav .sec,nav .brand{display:none} .seatwrap{grid-template-columns:1fr} }
</style>
</head>
<body>

<!-- 登入 -->
<div class="center" id="login" hidden>
  <div class="card">
    <h1>考猜後台</h1>
    <p class="muted">老師、行政請用登記在系統裡的 Email 登入。</p>
    <form id="emailForm">
      <input class="in" type="email" id="email" placeholder="teacher@gmail.com" required autocomplete="email">
      <button class="btn" style="width:100%;margin-top:10px" id="sendBtn">寄送驗證信</button>
    </form>
    <form id="codeForm" hidden>
      <input class="in" id="code" inputmode="numeric" maxlength="10" placeholder="信中的驗證碼" autocomplete="one-time-code">
      <button class="btn" style="width:100%;margin-top:10px">登入</button>
      <button type="button" class="btn ghost sm" style="margin-top:8px" id="resend">換一個 Email</button>
    </form>
    <div class="msg" id="loginMsg" hidden></div>
  </div>
</div>

<!-- 沒有權限 -->
<div class="center" id="denied" hidden>
  <div class="card">
    <h1>沒有後台權限</h1>
    <p><b id="deniedEmail"></b> 不在老師／行政名單中。請請管理者把這個 Email 加到老師資料裡。</p>
    <button class="btn ghost" id="logout2">登出</button>
  </div>
</div>

<!-- 後台 -->
<div class="shell" id="app" hidden>
  <nav>
    <div class="brand">考猜後台</div>
    <div class="sec">當天用</div>
    <a href="#roll" data-page="roll">點名表／訂餐</a>
    <a href="#seats" data-page="seats">座位表</a>
    <div class="sec">報名</div>
    <a href="#registrations" data-page="registrations">報名總表</a>
    <a href="#item_history" data-page="item_history">加退選紀錄</a>
    <a href="#logs" data-page="logs">修改紀錄</a>
    <div class="sec">行政</div>
    <a href="#changes" data-page="changes">資料異動審核 <span class="chip c-cx" id="chgBadge" hidden></span></a>
    <a href="#students" data-page="students">學生名單</a>
    <a href="#courses" data-page="courses">課程設定</a>
    <a href="#attendance_fee" data-page="attendance_fee">出席與學費</a>
    <a href="#exam_results" data-page="exam_results">會考成績</a>
    <div class="sec">帳號</div>
    <a href="#" id="logout">登出 <span class="muted" id="who"></span></a>
  </nav>
  <main>
    <div class="topbar">
      <select id="cat"></select>
      <select id="batch"></select>
      <span class="switch" id="regOpen"><span class="dot"></span><span>報名開放中</span></span>
      <span class="spacer"></span>
      <span class="muted">最後更新 <span id="updated">—</span></span>
      <button class="btn ghost sm" id="refresh">重新整理</button>
    </div>

    <!-- 點名表 -->
    <section id="page-roll" hidden>
      <div class="pills" id="courseTabs"></div>
      <div id="rollView">
        <div class="muted" id="courseInfo"></div>
        <div class="stats" id="stats"></div>
        <div class="tools">
          <input class="in" id="search" placeholder="搜尋姓名、學校">
          <label class="muted"><input type="checkbox" id="showCx"> 顯示已取消</label>
          <span class="spacer"></span>
          <button class="btn ghost sm" id="copyNames">複製姓名</button>
          <button class="btn ghost sm" id="csv">匯出 CSV</button>
        </div>
        <div class="tbl"><table><thead><tr><th>#</th><th>姓名</th><th>班別</th><th>學校</th><th>家長電話</th><th>當天中餐</th><th>出席</th><th>講義</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
      </div>
      <div id="mealView" hidden>
        <div class="stats" id="mealStats"></div>
        <div class="tools"><button class="btn ghost sm" id="copyMeal">複製訂餐摘要</button></div>
        <div class="mealgrid" id="mealLists"></div>
      </div>
    </section>

    <!-- 座位表 -->
    <section id="page-seats" hidden>
      <div class="pills" id="seatTabs"></div>
      <div class="tools noprint">
        <span class="muted" id="seatInfo"></span>
        <span class="spacer"></span>
        <select id="copyFrom" class="meal"><option value="">從其他科複製座位…</option></select>
        <button class="btn ghost sm" id="batchBtn">批次移回未排</button>
        <button class="btn ghost sm" onclick="print()">列印</button>
      </div>
      <p class="muted noprint" style="margin:0 0 8px">拖名字到座位排座；拖到別人座位＝交換；拖回右邊名單＝取消座位；在座位區按兩下＝批次勾選移回。</p>
      <div class="seatwrap">
        <div class="seatgrid" id="seatgrid"></div>
        <div><div class="muted" style="margin-bottom:6px">未排座位 <b id="unCount"></b></div><div class="unlist" id="unlist"></div></div>
      </div>
      <div class="panel" id="panel" hidden>
        <div style="display:flex;align-items:center;gap:8px"><b>勾選要移回未排名單的人</b><span class="spacer"></span>
          <button class="btn ghost sm" id="pAll">全選</button><button class="btn ghost sm" id="pClose">關閉</button></div>
        <div class="names" id="pNames"></div>
        <button class="btn" id="pGo">移回未排名單</button>
      </div>
    </section>
    <!-- 通用表格頁 -->
    <section id="page-table" hidden>
      <div class="subtabs" id="subtabs"></div>
      <div id="dtHost"></div>
    </section>
  </main>
</div>

<div class="drawer-bg" id="drawerBg" hidden></div>
<aside class="drawer" id="drawer" hidden>
  <header><h2 id="dTitle"></h2><button class="btn ghost sm" id="dClose">關閉</button></header>
  <form class="body" id="dBody" autocomplete="off"></form>
  <footer id="dFoot"></footer>
</aside>

<div class="toast" id="toast" hidden></div>

<script>
const SUPABASE_URL = 'https://ixdowmddybxdesgdgecp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fjpfXR09MR3U9dTB4u2HAg_Heiy-W5s';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WEEK = '日一二三四五六';
const md = d => { const x = new Date(d + 'T00:00'); return `${x.getMonth() + 1}/${x.getDate()}（${WEEK[x.getDay()]}）`; };
const hm = t => String(t || '').slice(0, 5);
function toast(t, err) { const el = $('toast'); el.textContent = t; el.className = 'toast' + (err ? ' err' : ''); el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, err ? 5000 : 2200); }
async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) {
    if (/Could not find the function|does not exist/i.test(error.message) && fn === 'admin_unseat')
      throw new Error('「移回未排」功能尚未啟用，請先在 Supabase 執行「啟用刪除功能.sql」');
    if (/Could not find the function|does not exist/i.test(error.message) && fn === 'admin_remove')
      throw new Error('刪除功能尚未啟用，請先在 Supabase 執行「啟用後台刪除列.sql」');
    throw new Error(error.message);
  }
  return data;
}

/* ===== 登入 ===== */
let pendingEmail = '';
$('emailForm').onsubmit = async e => {
  e.preventDefault();
  pendingEmail = $('email').value.trim().toLowerCase();
  $('sendBtn').disabled = true;
  const { error } = await sb.auth.signInWithOtp({ email: pendingEmail, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } });
  $('sendBtn').disabled = false;
  const m = $('loginMsg'); m.hidden = false;
  if (error) { m.className = 'msg err'; m.textContent = '寄送失敗：' + error.message; return; }
  m.className = 'msg info'; m.textContent = `驗證信已寄到 ${pendingEmail}`;
  $('emailForm').hidden = true; $('codeForm').hidden = false;
};
$('codeForm').onsubmit = async e => {
  e.preventDefault();
  const { error } = await sb.auth.verifyOtp({ email: pendingEmail, token: $('code').value.trim(), type: 'email' });
  if (error) { const m = $('loginMsg'); m.className = 'msg err'; m.textContent = '驗證碼不正確或已過期'; }
};
$('resend').onclick = () => { $('codeForm').hidden = true; $('emailForm').hidden = false; $('loginMsg').hidden = true; };
$('logout').onclick = e => { e.preventDefault(); sb.auth.signOut(); };
$('logout2').onclick = () => sb.auth.signOut();

async function onSession(session) {
  ['login', 'denied', 'app'].forEach(id => $(id).hidden = true);
  if (!session) { $('login').hidden = false; return; }
  if (location.hash.includes('access_token')) history.replaceState(null, '', location.pathname);
  const me = await rpc('admin_me').catch(() => null);
  if (!me || !me.is_staff) { $('deniedEmail').textContent = session.user.email; $('denied').hidden = false; return; }
  $('who').textContent = me.name || '';
  $('app').hidden = false;
  PREFS = await rpc('admin_get_prefs').catch(() => ({})) || {};
  rpc('admin_profile_changes').then(setChgBadge).catch(() => {});
  await loadBootstrap();
  route();
}

let PREFS = {}, LOOK = null, COURSES = null;
async function lookups(force) { if (!LOOK || force) LOOK = await rpc('admin_list', { p_key: 'lookups' }); return LOOK; }

const fmt = {

// 學年度從 8 月開始；入學年＝升國一那一年（西元）
function acadYear() { const d = new Date(); return d.getMonth() >= 7 ? d.getFullYear() : d.getFullYear() - 1; }
function gradeOf(y) {
  if (!y) return '未填入學年';
  const g = acadYear() - Number(y) + 7;
  return g < 7 ? '尚未入學' : g > 9 ? '已畢業' : ['國一', '國二', '國三'][g - 7];
}

class DataTable {
  constructor(cfg) {
    this.cfg = cfg; this.rows = []; this.sel = new Set(); this.filters = {}; this.q = ''; this.page = 0;
    const p = PREFS[cfg.key] || {};
    this.order = (p.order || []).filter(k => cfg.cols.some(c => c.k === k));
    // 新加的欄位放回它預設的位置（接在前一個欄位後面），不要都擠到最後
    cfg.cols.forEach((c, i) => {
      if (this.order.includes(c.k)) return;
      const prev = cfg.cols.slice(0, i).reverse().find(x => this.order.includes(x.k));
      this.order.splice(prev ? this.order.indexOf(prev.k) + 1 : 0, 0, c.k);
    });
    this.hidden = new Set(p.hidden || cfg.cols.filter(c => c.hide).map(c => c.k));
    this.sort = p.sort !== undefined ? p.sort : (cfg.sort || null);
    this.size = p.size || 50;

/* ===== 側邊編輯表單 ===== */
let DR = null;
function closeDrawer() { $('drawer').hidden = $('drawerBg').hidden = true; DR = null; }

    const c = $('dConfirm'); c.hidden = false;
    c.innerHTML = `<div class="confirmbar"><span>${esc(tb.cfg.deleteWarn ? tb.cfg.deleteWarn(DR.row) : '確定要刪除這一筆嗎？刪除後無法復原。')}</span><span class="spacer"></span>
      <button type="button" class="btn ghost sm" data-no>不要刪除</button><button type="button" class="btn danger sm" data-yes>確定刪除</button></div>`;
    return;
  }
  if (t.hasAttribute('data-no')) { $('dConfirm').hidden = true; return; }
  if (t.hasAttribute('data-yes')) {
    t.disabled = true;
    try { await tb.cfg.onDelete(DR.row); toast('已刪除'); closeDrawer(); await tb.reload(); }
    catch (x) { toast(x.message, true); t.disabled = false; }
    return;
  }
  const da = t.closest('[data-da]');
  if (da) {
    const a = DR.acts[+da.dataset.da];
    try {
      const msg = await a.run(DR.row, collect());
      if (a.close !== false) { closeDrawer(); await tb.reload(); }
      if (msg) toast(msg);
    } catch (x) { toast(x.message, true); }
  }
};
async function copyText(t, okMsg) {
  try { await navigator.clipboard.writeText(t); return okMsg; } catch { throw new Error('瀏覽器不允許複製，請手動選取文字'); }
}

      await rpc('admin_save_course', { p: { ...o, course_id: isNew ? null : row.course_id } });
      COURSES = null; await loadBootstrap();
    },
    onDelete: async r => { await rpc('admin_remove', { p_key: 'courses', p_id: r.course_id }); COURSES = null; await loadBootstrap(); },
    deleteWarn: r => `確定刪除「${r.batch} ${r.name}」這堂課？`,
  }),

  categories: () => ({
    key: 'categories', title: '活動種類', item: '活動', id: 'category',
    load: () => rpc('admin_list', { p_key: 'categories' }),
    note: '每個活動（例如 2026會考考猜）一列。「開放報名」關掉後，家長就不能再報名或修改。',
    cols: [
      { k: 'category', t: '活動名稱', html: r => `<b>${esc(r.category)}</b>` },
      { k: 'reg_open', t: '開放報名', type: 'bool' },
      { k: 'location', t: '上課地點', type: 'wrap' },
      { k: 'batches', t: '場次' },
      { k: 'registrations', t: '報名人數', type: 'num' },
      { k: 'created_at', t: '建立時間', type: 'dt', hide: true },
    ],
    defaults: () => ({ reg_open: false }),
    form: (v, isNew) => [
      isNew ? { k: 'category', t: '活動名稱', req: true, hint: '例如 2027會考考猜。建立後不能改名。' } : { t: '活動名稱', type: 'ro', val: v.category },
      { k: 'location', t: '上課地點', type: 'textarea', hint: '會顯示在報名表和提醒訊息裡' },
      { k: 'reg_open', t: '開放報名', type: 'bool', on: '開放家長報名和修改' },
    ],
    validate: o => reqText(o, 'category', '活動名稱'),
    onSave: async (o, isNew, row) => { await rpc('admin_save_category', { p: { ...o, _old_category: isNew ? null : row.category } }); LOOK = null; await loadBootstrap(); },
    onDelete: async r => { await rpc('admin_remove', { p_key: 'categories', p_id: r.category }); LOOK = null; await loadBootstrap(); },
    deleteWarn: r => `確定刪除「${r.category}」？只有沒有課程、也沒有報名的活動可以刪除。`,
  }),

  layouts: () => ({
    key: 'layouts', title: '教室座位格局', item: '座位格局', id: 'classroom_id', canAdd: false,
    load: () => rpc('admin_list', { p_key: 'layouts' }),
    note: '座位表依這裡的排數、列數畫座位。走道填列的編號，例如「5,10」代表第 5、10 列是走道。',
    cols: [
      { k: 'classroom', t: '教室', html: r => `<b>${esc(r.classroom)}</b>` },
      { k: 'capacity', t: '容納人數', type: 'num' },
      { k: 'seat_rows', t: '排數', type: 'num' },
      { k: 'seat_cols', t: '列數', type: 'num' },
      { k: 'aisle_cols', t: '走道列' },
      { k: 'door_label', t: '門口標示' },
    ],
    form: v => [
      { t: '教室', type: 'ro', val: v.classroom },
      { k: 'seat_rows', t: '排數（前後）', type: 'number', req: true },
      { k: 'seat_cols', t: '列數（左右，含走道）', type: 'number', req: true },
      { k: 'aisle_cols', t: '走道在第幾列', hint: '用逗號分開，例如 5,10' },
      { k: 'door_label', t: '門口標示', hint: '顯示在座位表左上角' },
    ],
    defaults: () => ({ seat_rows: 6, seat_cols: 14, door_label: '門口' }),
    prepare: async v => { v.seat_rows ??= 6; v.seat_cols ??= 14; v.door_label ??= '門口'; },
    onSave: (o, isNew, row) => rpc('admin_save_layout', { p: { ...o, classroom_id: row.classroom_id } }),
  }),

  attendance_fee: () => ({
    key: 'attendance_fee', title: '出席與學費', item: '學費', id: 'registration_id', canAdd: false,
    load: () => rpc('admin_list', { p_key: 'attendance_fee', p_category: S.cat, p_batch: S.tbatch || null }),
    note: '應收依「學費規則」用報名科目數自動計算。待收＝應收＋調整－已收。點一列登記收費。',
    rowClass: r => r.status === '已取消' ? 'cx' : '',
    cols: [
      { k: 'name', t: '學生姓名', html: r => `<b>${esc(r.name)}</b>` },
      { k: 'batch', t: '場次', type: 'chip' },
      { k: 'affiliation', t: '班別', type: 'chip', chips: CH.aff },
      { k: 'school', t: '學校', hide: true },
      { k: 'status', t: '狀態', type: 'chip', chips: CH.status },
      { k: 'registered', t: '報名科數', type: 'num' },
      { k: 'attended', t: '出席科數', type: 'num' },
      { k: 'attendance_status', t: '出席狀況', type: 'chip', chips: CH.att },
      { k: 'fee_expected', t: '應收', type: 'money', sum: true },
      { k: 'fee_adjust', t: '調整', type: 'money', sum: true },
      { k: 'fee_prepaid', t: '已收', type: 'money', sum: true },
      { k: 'due', t: '待收', type: 'money', sum: true, get: r => r.status === '已取消' ? 0 : (Number(r.fee_expected) || 0) + (Number(r.fee_adjust) || 0) - (Number(r.fee_prepaid) || 0) },
      { k: 'fee_note', t: '收費備註', type: 'wrap' },
    ],
    form: v => [
      { t: '學生', type: 'ro', val: `${v.name}（${v.batch}・報名 ${v.registered} 科）` },
      { t: '應收', type: 'ro', val: v.fee_expected == null ? '學費規則沒有對應的金額' : fmt.money(v.fee_expected) + ' 元' },
      { k: 'fee_prepaid', t: '已收金額', type: 'number' },
      { k: 'fee_adjust', t: '調整金額', type: 'number', hint: '折扣請填負數，例如 -200；加收填正數' },
      { k: 'fee_note', t: '收費備註', type: 'textarea', hint: '例如：現金、轉帳末五碼、收據號碼' },
    ],
    onSave: (o, isNew, row) => rpc('admin_save_fee', { p: { registration_id: row.registration_id, fee_prepaid: o.fee_prepaid, fee_adjust: o.fee_adjust, fee_note: o.fee_note } }),
  }),

  fee_rules: () => ({
    key: 'fee_rules', title: '學費規則', item: '學費規則', id: 'id',
    load: () => rpc('admin_list', { p_key: 'fee_rules', p_category: S.cat }),
    note: '依報名科目數決定學費。例如 1–3 科 1200 元、4–5 科 1800 元。',
    sort: { k: 'min_subjects', d: 1 },
    cols: [
      { k: 'category', t: '活動' },
      { k: 'min_subjects', t: '最少科數', type: 'num' },
      { k: 'max_subjects', t: '最多科數', type: 'num' },
      { k: 'fee', t: '學費（元）', type: 'money' },
    ],
    defaults: () => ({ category: S.cat }),
    prepare: async () => { await lookups(); },
    form: () => [
      { k: 'category', t: '活動', type: 'select', blank: false, opts: LOOK.categories },
      { k: 'min_subjects', t: '最少科數', type: 'number', req: true },
      { k: 'max_subjects', t: '最多科數', type: 'number', req: true },
      { k: 'fee', t: '學費（元）', type: 'number', req: true },
    ],
    validate: o => reqText(o, 'min_subjects', '最少科數') || reqText(o, 'max_subjects', '最多科數') || reqText(o, 'fee', '學費'),
    onSave: (o, isNew, row) => rpc('admin_save_fee_rule', { p: { ...o, id: isNew ? null : row.id } }),
    onDelete: r => rpc('admin_remove', { p_key: 'fee_rules', p_id: String(r.id) }),
  }),

  exam_results: () => ({
    key: 'exam_results', title: '會考成績', item: '會考成績', id: 'id',
    load: () => rpc('admin_list', { p_key: 'exam_results' }),
    sort: { k: 'year', d: -1 },
    note: '標籤空白時，系統依成績自動算出「nA m+」。建議紅包依 A 的數量自動計算，實際發放金額填在「紅包」。',
    cols: [
      { k: 'year', t: '年度', type: 'num' },
      { k: 'name', t: '學生姓名', html: r => `<b>${esc(r.name)}</b>` },
      { k: 'chinese', t: '國文' }, { k: 'english', t: '英文' }, { k: 'math', t: '數學' },
      { k: 'science', t: '自然' }, { k: 'social', t: '社會' }, { k: 'essay', t: '作文' },
      { k: 'label', t: '榜單標籤', type: 'chip' },
      { k: 'a_count', t: 'A 數', type: 'num', hide: true },
      { k: 'plus_count', t: '+ 數', type: 'num', hide: true },
      { k: 'red_envelope_suggested', t: '建議紅包', type: 'money', sum: true },
      { k: 'red_envelope', t: '紅包', type: 'money', sum: true },
      { k: 'received', t: '領取' },
      { k: 'parent', t: '家長', hide: true },
      { k: 'learning_note', t: '學習備註', type: 'wrap', hide: true },
    ],
    defaults: () => ({ year: new Date().getFullYear() }),
    prepare: async v => { await lookups(); if (v.student_id) { const s = LOOK.students.find(x => x.id === v.student_id); if (s) v.student_label = stuLabel(s); } },
    form: v => [
      { k: 'student_label', t: '學生', type: 'student', req: true },
      { k: 'year', t: '會考年度（西元）', type: 'number', req: true },
      { k: 'chinese', t: '國文', hint: '例如 A++、A+、A、B++' }, { k: 'english', t: '英文' }, { k: 'math', t: '數學' },
      { k: 'science', t: '自然' }, { k: 'social', t: '社會' }, { k: 'essay', t: '作文', hint: '級分，例如 6' },
      { k: 'honor_label', t: '榜單標籤（選填）', hint: '空白就用系統自動算的標籤' + (v.label ? `，目前是「${v.label}」` : '') },
      { k: 'red_envelope', t: '紅包金額', type: 'number', hint: v.red_envelope_suggested != null ? `系統建議 ${v.red_envelope_suggested} 元` : '' },
      { k: 'received', t: '領取狀態', list: ['已領', '未領'] },
      { k: 'learning_note', t: '學習備註', type: 'textarea' },
    ],
    validate: o => !o.student_id ? '請從名單選擇學生（要點選下拉出現的名字）' : reqText(o, 'year', '年度'),
    onSave: (o, isNew, row) => rpc('admin_save_exam_result', { p: { ...o, id: isNew ? null : row.id } }),
    onDelete: r => rpc('admin_remove', { p_key: 'exam_results', p_id: String(r.id) }),
    deleteWarn: r => `確定刪除 ${r.name} ${r.year} 年的會考成績？`,
  }),
};

async function reviewMany(rows, apply, tb) {
  const xs = rows.filter(r => r.status === '待審核');
  if (!xs.length) return toast('選取的資料都已經審核過了', true);
  if (!confirm(`確定把這 ${xs.length} 筆標記為「${apply ? '更新學生資料' : '不更新'}」？`)) return;
  try { for (const r of xs) await rpc('admin_review_change', { p_id: r.id, p_apply: apply }); toast(`已處理 ${xs.length} 筆`); STU = null; }
  catch (e) { toast(e.message, true); }
  tb.sel.clear(); await tb.reload();
}
function setChgBadge(rows) {
  const n = (rows || []).filter(r => r.status === '待審核').length;
  $('chgBadge').hidden = !n; $('chgBadge').textContent = n;
}
const TB = {};
const SUBTABS = {
  courses: [['courses', '課程'], ['categories', '活動種類'], ['layouts', '教室座位格局']],
  attendance_fee: [['attendance_fee', '出席與學費'], ['fee_rules', '學費規則']],
};
// 學生名單：預設只看國三，可切換全部
const STUDENT_TABS = [['g9', '國三'], ['all', '全部學生']];
S.sub = {};
async function openTablePage(page) {
  const tabs = page === 'students' ? STUDENT_TABS : SUBTABS[page];
  const sub = tabs ? (S.sub[page] || tabs[0][0]) : null;
  const key = page === 'students' ? 'students' : (sub || page);
  $('subtabs').hidden = !tabs;
  $('subtabs').innerHTML = tabs ? tabs.map(([k, t]) => `<button type="button" class="pill ${k === sub ? 'on' : ''}" data-sub="${k}">${t}</button>`).join('') : '';
  if (!TB[key]) TB[key] = new DataTable(TABLES[key]());
  const tb = TB[key];
  if (page === 'students') {
    if (sub === 'g9') { tb.filters.grade = '國三'; tb.locked = { grade: '國三' }; }
    else { if (tb.filters.grade === '國三') tb.filters.grade = ''; tb.locked = null; }
  }
  if (S.jump && key === 'item_history') { tb.filters = { name: S.jump }; tb.q = ''; S.jump = null; }
  tb.host = $('dtHost'); tb.bind();
  await tb.reload();
}
$('subtabs').onclick = e => { const b = e.target.closest('[data-sub]'); if (!b) return; S.sub[S.page] = b.dataset.sub; openTablePage(S.page).catch(x => toast(x.message, true)); };

/* ===== 啟動 ===== */
let lastUser;
sb.auth.onAuthStateChange((_e, session) => {
  const u = session?.user?.id || null;
  if (u === lastUser) return; lastUser = u;
  setTimeout(() => onSession(session), 0);
});
</script>
